  /api/v1/product-variant-prices:
    get:
      summary: Get prices for product variants
      description: 'Returns retailer-specific wholesale prices for a batch of product variants.

        Prices are computed with all applicable discounts applied (AKS+, segment,

        business-event discounts), so `wholesale_price` reflects the actual price

        the authenticated retailer would pay.


        Both the original (pre-discount) and the effective (post-discount) wholesale

        prices are returned so callers can display strikethrough pricing when a

        discount applies.


        Variants not found or not priceable for the authenticated retailer are

        silently omitted from the response.

        '
      operationId: get-product-variant-prices
      tags:
      - Catalog
      parameters:
      - name: filter[id][]
        description: 'One or more product variant UUIDs to price. Repeat the parameter for

          each UUID. Minimum 1, maximum 50 per request.

          '
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 50
        example:
        - 3571bdc1-fa01-44fa-9342-d99bd1c2befa
        - 4271bdc1-fa01-44fa-9342-d99bd1c2befa
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - type
                      - id
                      - attributes
                      properties:
                        type:
                          type: string
                          enum:
                          - product-variant-prices
                          description: JSON:API resource type.
                        id:
                          type: string
                          format: uuid
                          description: The product variant UUID.
                        attributes:
                          type: object
                          required:
                          - original_wholesale_price
                          - wholesale_price
                          - discount_rate
                          properties:
                            original_wholesale_price:
                              type: object
                              description: Wholesale price before any retailer-specific discount.
                              required:
                              - amount
                              - currency
                              properties:
                                amount:
                                  type: integer
                                  description: Amount in the currency's minor unit (e.g. cents for EUR).
                                  example: 2000
                                currency:
                                  type: string
                                  description: ISO-4217 currency code.
                                  example: EUR
                            wholesale_price:
                              type: object
                              description: Effective wholesale price after all applicable discounts.
                              required:
                              - amount
                              - currency
                              properties:
                                amount:
                                  type: integer
                                  description: Amount in the currency's minor unit (e.g. cents for EUR).
                                  example: 1800
                                currency:
                                  type: string
                                  description: ISO-4217 currency code.
                                  example: EUR
                            discount_rate:
                              type: integer
                              description: Highest discount percentage applied as a whole number (e.g. 10 means 10% off). 0 when no discount applies.
                              example: 10
              examples:
                example:
                  value:
                    data:
                    - type: product-variant-prices
                      id: 3571bdc1-fa01-44fa-9342-d99bd1c2befa
                      attributes:
                        original_wholesale_price:
                          amount: 2000
                          currency: EUR
                        wholesale_price:
                          amount: 1800
                          currency: EUR
                        discount_rate: 10
                    - type: product-variant-prices
                      id: 4271bdc1-fa01-44fa-9342-d99bd1c2befa
                      attributes:
                        original_wholesale_price:
                          amount: 1500
                          currency: EUR
                        wholesale_price:
                          amount: 1500
                          currency: EUR
                        discount_rate: 0
