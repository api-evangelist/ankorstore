    post:
      operationId: create-order-pay-customer
      summary: Create a customer
      description: Creates a new OrderPay customer.
      tags:
      - OrderPay
      parameters:
      - name: Accept
        in: header
        description: application/vnd.api+json
        schema:
          type: string
          default: application/vnd.api+json
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    type:
                      type: string
                      const: order-pay-customer
                    attributes:
                      type: object
                      properties:
                        storeName:
                          type: string
                        email:
                          type: string
                        firstName:
                          type: string
                        lastName:
                          type: string
                        company:
                          type: object
                          properties:
                            phoneNumber:
                              type: string
                            taxNumber:
                              type: string
                            vatNumber:
                              type: string
                            vatExemption:
                              type: boolean
                          required:
                          - phoneNumber
                          - vatExemption
                        billingAddress:
                          type: object
                          properties:
                            street:
                              type: string
                            postalCode:
                              type: string
                            city:
                              type: string
                            countryCode:
                              type: string
                              default: FR
                          required:
                          - street
                          - postalCode
                          - city
                        shippingAddress:
                          type: object
                          properties:
                            street:
                              type: string
                            postalCode:
                              type: string
                            city:
                              type: string
                            countryCode:
                              type: string
                              default: FR
                          required:
                          - street
                          - postalCode
                          - city
                      required:
                      - storeName
                      - email
                      - firstName
                      - lastName
                      - company
                      - billingAddress
                      - shippingAddress
                  required:
                  - type
                  - attributes
              required:
              - data
      responses:
        '201':
          description: Single Customer resource
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  jsonapi:
                    description: An object describing the server's implementation
                    type: object
                    properties:
                      version:
                        type: string
                      meta:
                        description: Non-standard meta-information that can not be represented as an attribute or relationship.
                        type: object
                        additionalProperties: true
                    additionalProperties: false
                  data:
                    title: CustomerResource
                    type: object
