  /api/v1/fulfillment/costs/order:
    post:
      summary: Get the fulfillment costs
      operationId: fulfillment-costs-get-specifications
      description: Returns a list of fulfillment costs for the given specification.
      tags:
      - Fulfillment
      parameters:
      - name: Accept
        in: header
        description: application/vnd.api+json
        schema:
          type: string
          default: application/vnd.api+json
      requestBody:
        description: The order fulfillment specification.
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  required:
                  - type
                  - attributes
                  properties:
                    type:
                      type: string
                      enum:
                      - fulfillment-order-costs-specification
                    attributes:
                      type: object
                      required:
                      - shipToCountry
                      - shipToPostalCode
                      - parcels
                      - pickingQuantity
                      properties:
                        shipToCountry:
                          description: A 2-letter ISO-3166 country code of the destination country.
                          type: string
                          example: GB
                        shipToPostalCode:
                          description: Postal code of the destination, used for remote-area surcharge and FR/MC region resolution.
                          type: string
                          example: '75001'
                        parcels:
                          type: array
                          items:
                            type: object
                            required:
                            - length
                            - width
                            - height
                            - weight
                            properties:
                              length:
                                description: Parcel length in centimeters
                                type: integer
                                minimum: 0
                              width:
                                description: Parcel width in centimeters
                                type: integer
                                minimum: 0
                              height:
                                description: Parcel height in centimeters
                                type: integer
                                minimum: 0
                              weight:
                                description: Parcel weight in grams
                                type: integer
                                minimum: 0
                              packageType:
                                description: Type of package, used to route to the parcel or pallet pricing grid. When omitted, it is estimated from the parcel dimensions.
                                type: string
                                enum:
                                - parcel
                                - pallet
                        pickingQuantity:
                          type: integer
                          minimum: 0
      responses:
        '200':
          description: List of fulfillment costs
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - type
                      - id
                      - attributes
                      properties:
                        type:
                          type: string
                          default: fulfillment-order-costs
                        id:
                          type: string
                          description: '[resource object identifier (uuid)](https://jsonapi.org/format/#document-resource-object-identification)'
                          format: uuid
                        attributes:
                          type: object
                          properties:
                            category:
                              type: string
                              enum:
                              - shipping
                              - order pick lt 4u
                              - order pick lt 40u
                              - order pick gt 40u
                              - unit pick lt 4u
                              - unit pick lt 40u
                              - unit pick gt 40u
                            quantity:
                              type: integer
                              minimum: 0
                            unitAmount:
                              type: integer
                              minimum: 0
                            totalAmount:
                              type: integer
                              minimum: 0
                            vatRate:
                              type: number
                              format: double
                              minimum: 0
                              maximum: 100
                              example: 20
                            totalAmountWithVat:
                              type: integer
                              minimum: 0
                  jsonapi:
                    description: An object describing the server's implementation
                    type: object
                    properties:
                      version:
                        type: string
                      meta:
                        description: Non-standard meta-information that can not be represented as an attribute or relationship.
                        type: object
                        additionalProperties: true
                    additionalProperties: false
                required:
                - data
                - jsonapi
              examples:
                example:
