  /api/v1/fulfillment/feasibility:
    post:
      summary: Check fulfillment feasibility
      operationId: fulfillment-feasibility-check
      description: 'Checks whether fulfillment is feasible for a given brand, delivery destination, and set of items.

        Returns an empty 200 response when fulfillment is feasible, or a 400 response with JSON:API

        errors when it is not.


        **Feasibility checks performed:**

        - Brand is enrolled for fulfillment (`not_a_fulfillment_brand`)

        - Delivery destination is allowed (`AllowedFulfillmentDestination` validation)

        - HS codes are present for non-EU destinations (`missing_hs_code_for_international_order`)

        - Items are available in the warehouse with sufficient stock and shelf life (`unavailable_items`)

        '
      tags:
      - Fulfillment
      parameters:
      - name: Accept
        in: header
        description: application/vnd.api+json
        schema:
          type: string
          default: application/vnd.api+json
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  required:
                  - type
                  - attributes
                  properties:
                    type:
                      type: string
                      enum:
                      - feasibility-check
                    attributes:
                      type: object
                      required:
                      - deliveryAddress
                      - items
                      properties:
                        deliveryAddress:
                          type: object
                          required:
                          - countryCode
                          - postalCode
                          - city
                          - street
                          properties:
                            countryCode:
                              type: string
                              minLength: 2
                              maxLength: 2
                              example: FR
                            postalCode:
                              type: string
                              example: '75001'
                            city:
                              type: string
                              example: Paris
                            street:
                              type: string
                              example: 123 Rue de Rivoli
                            additionalAddress:
                              type: string
                              nullable: true
                              example: 2nd floor
                        items:
                          type: array
                          minItems: 1
                          items:
                            type: object
                            required:
                            - productVariantUuid
                            - quantity
                            properties:
                              productVariantUuid:
                                type: string
                                format: uuid
                              quantity:
                                type: integer
                                minimum: 1
                              minimumRemainingShelfLife:
                                type: integer
                                minimum: 0
                                nullable: true
                                description: 'Minimum remaining shelf life in days. When specified, the fulfillment

                                  center will ensure items have at least this many days of shelf life

                                  remaining. Null for non-perishable items.

                                  '
      responses:
        '200':
          description: Fulfillment is feasible. Empty response body.
        '400':
          description: Fulfillment is not feasible.
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        detail:
                          type: string
                          description: Machine-readable reason code
                          enum:
                          - not_a_fulfillment_brand
                          - unavailable_items
                          - missing_hs_code_for_international_order
                        status:
                          type: string
                          example: '400'
                        title:
                          type: string
                          description: Human-readable error message
                        meta:
                          type: object
                          additionalProperties: true
              examples:
                not_a_fulfillment_brand:
                  value:
                    errors:
                    - detail: not_a_fulfillment_brand
                      status: '400'
                      title: Brand is not enrolled for fulfillment
                      meta: {}
                unavailable_items:
                  value:
                    errors:
                    - detail: unavailable_items
                      status: '400'
                      title: Some items are not available for fulfillment
                      meta: {}
