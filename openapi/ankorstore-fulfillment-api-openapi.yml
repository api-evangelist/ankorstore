    post:
      summary: Create Fulfillment Item
      operationId: fulfillment-create-item
      description: 'Create a fulfillment item for the authenticated brand.

        The referenced product variant must belong to the authenticated brand.

        '
      tags:
      - Fulfillment
      parameters:
      - name: Accept
        in: header
        description: application/vnd.api+json
        schema:
          type: string
          default: application/vnd.api+json
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  title: FulfillmentItemInput
                  description: Input schema for creating a fulfillment item on the public API
                  type: object
                  properties:
                    productVariantId:
                      type: string
                      format: uuid
                      description: The product variant UUID. Must belong to the authenticated brand.
                    barcode:
                      type: string
                      pattern: ^\d{13,14}$
                    unitsPerBatch:
                      type: integer
                      minimum: 1
                    unitCost:
                      type: number
                      format: float
                      minimum: 1
                    unitCostMargin:
                      type: number
                      format: float
                      minimum: 0
                    sku:
                      type: string
                    productName:
                      type: string
                    categoryName:
                      type: string
                    classificationCode:
                      type: string
                    expiryTracked:
                      type: boolean
                      default: false
                    shelfLife:
                      type:
                      - integer
                      - 'null'
                    lotTracked:
                      type: boolean
                      default: false
                    isFragile:
                      type:
                      - boolean
                      - 'null'
                      default: false
                    isOrganic:
                      type:
                      - boolean
                      - 'null'
                      default: false
                    needRepack:
                      type:
                      - boolean
                      - 'null'
                      default: false
                    needRelabel:
                      type:
                      - boolean
                      - 'null'
                      default: false
                    alcoholCode:
                      type:
                      - integer
                      - 'null'
                      minimum: 1
                      maximum: 11
                    alcoholPercentage:
                      type:
                      - number
                      - 'null'
                      format: float
                      minimum: 0
                      maximum: 100
                    volumeOfLiquidPerPack:
                      type:
                      - number
                      - 'null'
                      format: float
                      minimum: 0
                      maximum: 100
                    icpeCode:
                      type: integer
                      minimum: 1000
                      maximum: 4999
                  required:
                  - productVariantId
                  - barcode
                  - unitsPerBatch
                  - sku
                  - unitCost
                  - unitCostMargin
                  - productName
                  - categoryName
              required:
              - data
