                            type: string
                            format: uuid
                          filename:
                            type: string
                          status:
                            type: string
                            enum:
                            - created
                            - in_process
                            - completed
                            - partially_completed
                            - failed
                          from:
                            type: string
                            format: date-time
                          to:
                            type: string
                            format: date-time
                          expiresAt:
                            type: string
                            format: date-time
                          finishedAt:
                            type:
                            - 'null'
                            - string
                            format: date-time
                          downloadLink:
                            type:
                            - 'null'
                            - string
                            format: url
                        required:
                        - type
                        - brandUuid
                        - filename
                        - status
