    get:
      summary: List Internal Orders
      description: Retrieve a list of Internal Orders
      operationId: list-internal-orders
      tags:
      - Ordering
      parameters:
      - name: Accept
        in: header
        description: application/vnd.api+json
        schema:
          type: string
          default: application/vnd.api+json
      - name: filter[retailer]
        in: query
        description: Retailer Id
        allowEmptyValue: true
        required: false
        schema:
          type: string
          example: 23e4567-e89b-12d3-a456-426614174000
      - name: filter[status]
        in: query
        description: Order Status
        allowEmptyValue: true
        required: false
        schema:
          type: string
          example: ankor_confirmed
          enum:
          - ankor_confirmed
          - rejected
          - brand_confirmed
          - shipping_labels_generated
          - fulfillment_requested
          - shipped
          - reception_refused
          - received
          - invoiced
          - brand_paid
          - cancelled
      - name: include
        in: query
        description: 'A comma-separated list of resources to include (e.g: retailer,billingItems,orderItems.productVariant.product). If you include orderItems.productVariant you do not need to specify orderItems separately, it will be automatically included.'
        schema:
          type: string
          enum:
          - retailer
          - billingItems
          - orderItems
          - orderItems.productVariant
          - orderItems.productVariant.product
      - name: page[limit]
        in: query
        description: limit the amount of results returned
        required: false
        schema:
          type: integer
          format: int64
      - name: page[before]
        in: query
        description: show items before the provided ID (uuid format)
        required: false
        schema:
          type: string
      - name: page[after]
        in: query
        description: show items after the provided ID (uuid format)
        required: false
        schema:
          type: string
