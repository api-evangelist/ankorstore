  /api/v1/ordering/billing-exports/{billing_export}/-actions/download:
    get:
      summary: Download a Billing Export
      operationId: ordering-billing-exports-download
      description: Downloads a completed billing export
      tags:
      - Ordering
      parameters:
      - schema:
          type: string
          format: uuid
        name: billing_export
        in: path
        required: true
        description: Uuid of the Billing Export to download
      responses:
        '200':
          description: Returns billing export file content in body
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      file:
                        type: string
                        format: binary
                  jsonapi:
                    description: An object describing the server's implementation
