    post:
      summary: Create master order shipment tracking
      description: Create shipment information like the parcels and the tracking information
      operationId: post-master-order-shipping-shipment
      tags:
      - Ordering
      parameters:
      - name: Accept
        in: header
        description: application/vnd.api+json
        schema:
          type: string
          default: application/vnd.api+json
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          description: '[resource object identifier (uuid)](https://jsonapi.org/format/#document-resource-object-identification)'
          format: uuid
      - name: include
        in: query
        allowEmptyValue: true
        required: false
        schema:
          type: string
          enum:
          - shipmentParcel
          - shipmentQuote
          - shippedItems
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - shipping-shipment
                    id:
                      type: string
                      description: '[resource object identifier (uuid)](https://jsonapi.org/format/#document-resource-object-identification)'
                      format: uuid
                    attributes:
                      type: object
                      additionalProperties: false
                      required:
                      - status
                      - carrier
                      properties:
                        carrier:
                          type:
                          - 'null'
                          - string
                          description: The carrier name - set 'other' if the carrier is not known yet
                        trackingNumber:
                          type:
                          - 'null'
                          - string
                        trackingLink:
                          type:
                          - 'null'
                          - string
                          description: Tracking link to the carrier's website - if null and if the carrier is known, the tracking link will be generated by Ankorstore
                        status:
                          type: string
                          enum:
                          - UNKNOWN
                          - PRE_TRANSIT
                          - TRANSIT
                          - DELIVERED
                          - RETURNED
                          - FAILURE
                        fromAddress:
                          description: The address from where the parcels are shipped
                          type: object
                          properties:
                            data:
                              type: object
                              required:
                              - name
                              - street
                              - city
                              - postalCode
                              - countryCode
                              properties:
                                name:
                                  type: string
                                street:
                                  type: string
                                city:
                                  type: string
                                postalCode:
                                  type: string
                                countryCode:
                                  type: string
                                  format: iso3166-1-alpha-2
                    relationships:
                      type: object
                      required:
                      - shipmentParcel
                      properties:
                        shipmentParcel:
                          type: object
                          properties:
                            data:
                              type: array
                              items:
                                type: object
                                required:
                                - type
                                - id
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - shipping-shipment-parcel
                                  id:
                                    type: string
                                    description: '[resource object identifier (uuid)](https://jsonapi.org/format/#document-resource-object-identification)'
                                    format: uuid
                                  attributes:
                                    type: object
                                    additionalProperties: false
                                    required:
                                    - status
                                    properties:
                                      trackingNumber:
                                        type:
                                        - 'null'
                                        - string
                                      trackingLink:
                                        type:
                                        - 'null'
                                        - string
                                        description: Tracking link to the carrier's website - if null and if the carrier is known, the tracking link will be generated by Ankorstore
                                      status:
                                        type: string
                                        enum:
                                        - UNKNOWN
                                        - PRE_TRANSIT
                                        - TRANSIT
                                        - DELIVERED
                                        - RETURNED
                                        - FAILURE
                                      length:
                                        description: The length of the parcel in cm
                                        type:
                                        - 'null'
                                        - integer
                                      width:
                                        description: The width of the parcel in cm
                                        type:
                                        - 'null'
                                        - integer
                                      height:
                                        description: The height of the parcel in cm
                                        type:
                                        - 'null'
                                        - integer
                                      weight:
                                        description: The weight of the parcel in grams
                                        type:
                                        - 'null'
                                        - integer
                                      sscc:
                                        description: Serial Shipping Container Code (SSCC) for traceability
                                        type:
                                        - 'null'
                                        - string
                                      shippedItems:
                                        description: Items shipped in this parcel
                                        type: array
                                        items:
                                          type: object
                                          required:
                                          - productVariantUuid
                                          - batchQuantity
                                          - unitQuantity
                                          properties:
                                            productVariantUuid:
                                              type: string
                                              format: uuid
                                              description: The UUID of the product variant
                                            batchQuantity:
                                              type: integer
                                              minimum: 1
                                              description: Number of batches (e.g. boxes) shipped
                                            unitQuantity:
                                              type: integer
                                              minimum: 1
                                              description: Number of individual units shipped
                                            lotNumber:
                                              type:
                                              - 'null'
                                              - string
                                              description: Lot or batch number for traceability
                                              maxLength: 100
                                            expiryDate:
