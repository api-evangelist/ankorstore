  /api/v1/ordering/master-orders/{id}/-actions/update-order-items:
    post:
      summary: Update wrapped order items by given master order ID
      operationId: ordering-update-order-items
      description: 'Updates the target quantity for one or more items of an order.


        **Quantity**

        Each item requires a `unitQuantity` field representing the total unit count.


        | `unitQuantity` value | Stored batch qty | Stored multiplied qty |

        |---|---|---|

        | evenly divisible by `unit_multiplier` | `unitQuantity / unit_multiplier` | `unitQuantity` |

        | **not** evenly divisible | `1` (one custom batch) | `unitQuantity` |

        | `0` | — | line removed |


        **Behavior**

        - `unitQuantity = 0` removes the line.

        - If the same `orderItemUuid` appears multiple times in `items`, **the last occurrence wins**.

        - Items not belonging to this order are **ignored**. If all rows are foreign, the response is **204** with **no new event**.'
      tags:
      - Ordering
      parameters:
      - name: id
        in: path
        description: UUID of the requested resource
        schema:
          type: string
          format: uuid
        required: true
      - name: Accept
        in: header
        description: application/vnd.api+json
        schema:
          type: string
          default: application/vnd.api+json
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  required:
                  - attributes
                  properties:
                    type:
                      type: string
                    attributes:
                      type: object
                      required:
                      - items
                      properties:
                        items:
                          type: array
                          minItems: 1
                          items:
                            type: object
                            description: One batch update row.
                            properties:
                              orderItemUuid:
                                type:
                                - string
                                - 'null'
                                format: uuid
                                description: UUID of an existing order item to update/remove.
                              productVariantUuid:
                                type:
                                - string
                                - 'null'
                                format: uuid
                                description: UUID of a product variant to add as a new line (used when `orderItemUuid` is omitted).
                              unitQuantity:
                                type: integer
                                minimum: 0
                                description: 'Target unit quantity for the line (0 removes the line). Stored directly as `multiplied_quantity`. Does not need to be evenly divisible by the product''s `unit_multiplier`. When evenly divisible, batch quantity = `unitQuantity / unit_multiplier`; when not evenly divisible, packs are broken and batch quantity = `1` (one custom batch).

                                  '
                              unitPrice:
                                type:
                                - integer
                                - 'null'
                                minimum: 0
                                description: Wholesale price for item.
                            required:
                            - unitQuantity
                            anyOf:
                            - required:
                              - orderItemUuid
                            - required:
                              - productVariantUuid
      responses:
        '204':
          description: No content
