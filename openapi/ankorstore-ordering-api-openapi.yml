                                - accounting_complete
                                - invoicing
                              formats:
                                type: array
                                items:
                                  type: string
                                  enum:
                                  - csv
                                  - xlsx
                                  - pdf
                            required:
                            - type
                            - formats
                        from:
                          type: string
                          format: date
                        to:
                          type: string
                          format: date
                      required:
                      - from
                      - to
                      - exports
                  required:
                  - attributes
              required:
              - data
