  /api/v1/external-orders/non-ankorstore-fulfillment-orders:
    post:
      summary: Create NAFO External Order
      operationId: ordering-create-non-ankorstore-fulfillment-order
      description: Creates a new External Order of type `nafo`
      tags:
      - Ordering
      parameters:
      - name: Accept
        in: header
        description: application/vnd.api+json
        schema:
          type: string
          default: application/vnd.api+json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shippingAddress:
                  description: Shipping address of the recipient.
                  type: object
                  properties:
                    country:
                      type: string
                      description: ISO 3166-1 country code.
                      pattern: ^[A-Z]{2}$
                    postalCode:
                      type: string
                      description: Valid postal code, matching the country.
                    city:
                      type: string
                      minLength: 1
                      maxLength: 255
                      description: Name of the destination city.
                    street:
                      type: string
                      minLength: 1
                      maxLength: 60
                      description: 'Street address, should not exceed the maximum length

                        in order to fit the dedicated place on the shipping label.

                        '
                    company:
                      type: string
                      maxLength: 70
                      description: Name of the company
                    firstName:
                      type: string
                      minLength: 1
                      maxLength: 64
                      description: First name of the person, receiving the order
                    lastName:
                      type: string
                      minLength: 1
                      maxLength: 64
                      description: Last name of the person, receiving the order
                    phone:
                      type: string
                      minLength: 1
                      description: Phone number of the person, receiving the order. The format match the country.
                    email:
                      type: string
                      format: email
                      description: Email of the person, receiving the order
                  required:
                  - country
                  - postalCode
                  - city
                  - street
                  - company
                  - firstName
                  - lastName
                  - phone
                  - email
                items:
                  type: array
                  description: List of fulfillable items with their corresponding quantities.
                  items:
                    type: object
                    properties:
                      fulfillableId:
                        type: string
                        format: uuid
                        description: Fulfillable identifier, find more about it [here](#tag/Fulfillment/About-Fulfillment).
                      quantity:
                        type: integer
                        description: Quantity of the fulfillable item in units.
                      minimumRemainingShelfLife:
                        type: integer
                        nullable: true
                        description: Minimum remaining shelf life in days. When specified, the fulfillment center will ensure items have at least this many days of shelf life remaining.
                    required:
                    - fulfillableId
                    - quantity
                masterOrderUuid:
                  type: string
                  format: uuid
                  description: 'Pre-generated UUID for the order being created. Despite this UUID is optional and being omitted,

                    will be generated by the system, having it in advance will make it easier to identify and track the

                    status of the created order (considering the asynchronous nature of the process).

                    '
                customReference:
                  type: string
                  description: 'Optional brand-defined custom reference to add to the created order.

                    Usually represents some order identifier in the brand''s order management system, used outside of Ankorstore.

                    '
                recipientType:
                  description: The type of recipient for this order
                  type: string
                  enum:
                  - business
                  - consumer
                  default: business
                pickupAtDock:
                  type: boolean
                  nullable: true
                  default: false
                  description: 'Indicates whether the shipment should be picked up at the dock.

                    Defaults to false if not provided.

                    '
                deliverySchedule:
                  nullable: true
                  description: 'Allow you to specify opening times for the customer.

                    '
                  type: object
                  additionalProperties: false
                  properties:
                    timeSlots:
                      type: array
                      description: 'Opening times for the customer''s business. The time slots when the customer is available for delivery expressed as ranges in 24-hour time format. When null, the customer can be delivered anytime.

                        '
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          startTime:
                            type: string
                            description: 'Start of the opening time expressed in a 24-hour time format (e.g. `14:00`).

                              '
                            example: 09:30
                          endTime:
                            type: string
                            description: 'End of the opening time expressed in a 24-hour time format (e.g. `14:00`).

                              '
                            example: '12:30'
                        required:
                        - startTime
                        - endTime
                      nullable: true
                    openDays:
                      description: 'The opening days for the customer''s business. ISO 8601 numeric representation of the day of the week (`1` for Monday through `7` for Sunday).

                        '
                      type: array
                      items:
                        type: integer
                        minimum: 1
                        maximum: 7
                      minItems: 1
                      uniqueItems: true
                      example:
                      - 1
                      - 2
                      - 3
                  required:
                  - timeSlots
                  - openDays
                packingInstruction:
                  nullable: true
                  description: Allow you to specify specific instructions for packing.
                  type: object
                  additionalProperties: false
                  required:
                  - services
                  properties:
                    services:
                      type: array
                      description: List of services to be performed on the order. Either `PALLETISE`, `DOCS`, `CUSTOM_BUILD` or `SSCC`
                      minItems: 1
                      items:
                        type: string
                        enum:
                        - PALLETISE
                        - CUSTOM_BUILD
                        - DOCS
                        - SSCC
                    instruction:
                      type: string
                      description: Instruction text for packing the order.
                deliveryAppointment:
                  nullable: true
                  description: 'Allow you to specify the need of booking an appointment before delivery

                    '
                  type: object
                  additionalProperties: false
                  required:
                  - requested
                  properties:
                    requested:
                      type: boolean
                      description: Is an appointment requested?
                    instruction:
                      type: string
                      description: Instruction text for booking an appointment.
                invoiceUuid:
                  type: string
                  format: uuid
                  description: 'UUID for the invoice document (type: fulfillment-media) associated with this order. The UUID should correspond to a document previously uploaded via POST /api/fulfillment/v1/media/upload

                    Required if the order crosses a customs border

                    '
              required:
              - shippingAddress
              - items
      responses:
        '200':
          description: No content
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  jsonapi:
                    description: An object describing the server's implementation
                    type: object
                    properties:
                      version:
                        type: string
                      meta:
                        description: Non-standard meta-information that can not be represented as an attribute or relationship.
                        type: object
                        additionalProperties: true
                    additionalProperties: false
