      requestBody:
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                publicAddress:
                  type: object
                  properties:
                    street:
                      type: string
                      example: 123 Main Street
                    postalCode:
                      type: string
                      example: '75001'
                    city:
                      type: string
                      example: Paris
                    countryCode:
                      type: string
                      pattern: ^[A-Z]{2}$
                      example: FR
                  required:
                  - street
                  - postalCode
                  - city
                  - countryCode
                  description: Public/display address (optional for partial updates)
                shippingAddress:
                  type: object
                  properties:
                    street:
                      type: string
                      example: 456 Warehouse Ave
                    postalCode:
                      type: string
                      example: '75002'
                    city:
                      type: string
                      example: Paris
                    countryCode:
                      type: string
                      pattern: ^[A-Z]{2}$
                      example: FR
                  required:
                  - street
                  - postalCode
                  - city
                  - countryCode
                  description: Shipping origin address (optional for partial updates)
                billingAddress:
                  type: object
                  properties:
                    street:
                      type: string
                      example: 789 Billing Street
                    postalCode:
                      type: string
                      example: '75003'
                    city:
                      type: string
                      example: Paris
                    countryCode:
                      type: string
                      pattern: ^[A-Z]{2}$
                      example: FR
                  required:
                  - street
                  - postalCode
                  - city
                  - countryCode
                  description: Billing address (optional for partial updates, admin/candidate only)
                eoriNumber:
                  type: string
                  example: GB123456789000
                  description: EORI number (required when shipping to/from UK, optional for partial updates)
                lucidNumber:
                  type: string
                  minLength: 15
                  maxLength: 15
                  example: DE1234567890123
                  description: LUCID number (required when shipping to Germany, optional for partial updates)
                averageLeadTime:
                  type: string
                  enum:
                  - 0-2
                  - 3-5
                  - 6-10
                  - 11-20
                  - 21-30
                  example: 3-5
                  description: 'Average lead time range in business days. Must be one of: 0-2, 3-5, 6-10, 11-20, 21-30'
                whitelistCountries:
                  type:
                  - 'null'
                  - array
                  items:
                    type: string
                    pattern: ^[A-Z]{2}$
                  description: List of ISO 3166-1 alpha-2 country codes (optional for partial updates)
                  example:
                  - FR
                  - DE
                  - GB
              additionalProperties: false
            examples:
              v1_full_update:
                summary: V1 - Full Update (Existing Behavior)
                description: Complete update with all required fields
                value:
                  publicAddress:
                    street: 123 Main Street
                    postalCode: '75001'
                    city: Paris
                    countryCode: FR
                  shippingAddress:
                    street: 456 Warehouse Ave
                    postalCode: '75002'
                    city: Paris
                    countryCode: FR
                  billingAddress:
                    street: 789 Billing Street
                    postalCode: '75003'
                    city: Paris
                    countryCode: FR
                  eoriNumber: GB123456789000
                  lucidNumber: DE1234567890123
                  averageLeadTime: 3-5
                  whitelistCountries:
                  - FR
                  - DE
                  - GB
              v2_partial_single_field:
                summary: V2 - Partial Update (Single Field)
                description: Update only the average lead time, preserve all other values
                value:
                  averageLeadTime: 0-2
              v2_partial_multiple_fields:
                summary: V2 - Partial Update (Multiple Fields)
                description: Update lead time and whitelist countries
                value:
                  averageLeadTime: 3-5
                  whitelistCountries:
                  - FR
                  - DE
                  - ES
                  - IT
              v2_partial_address_only:
                summary: V2 - Partial Update (Address Only)
                description: Update only the public address
                value:
                  publicAddress:
                    street: 999 New Street
                    postalCode: '75004'
                    city: Paris
                    countryCode: FR
              v2_partial_compliance_fields:
                summary: V2 - Partial Update (Compliance Fields)
                description: Update EORI and LUCID numbers only
                value:
                  eoriNumber: GB987654321000
                  lucidNumber: DE9876543210987
