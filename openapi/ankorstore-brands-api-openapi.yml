  /api/v1/brands/payouts:
    get:
      summary: List brand payouts
      operationId: get-api-v1-brands-payouts
      description: List payouts for the authenticated brand. Returns paginated payout records including transfer details.
      parameters:
      - name: Accept
        in: header
        description: application/vnd.api+json
        schema:
          type: string
          default: application/vnd.api+json
      - name: page[offset]
        in: query
        description: Number of items to skip
        required: false
        schema:
          type: integer
          default: 0
      - name: page[limit]
        in: query
        description: Maximum number of items to return
        required: false
        schema:
          type: integer
          default: 20
      tags:
      - Brands
      responses:
        '200':
          description: Paginated list of payouts
          content:
            application/vnd.api+json:
              schema:
                type: object
                required:
                - jsonapi
                - data
                - meta
                properties:
                  jsonapi:
                    description: An object describing the server's implementation
                    type: object
                    properties: &id009
                      version:
                        type: string
                      meta:
                        description: Non-standard meta-information that can not be represented as an attribute or relationship.
                        type: object
                        additionalProperties: true
                    additionalProperties: false
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - type
                      - attributes
                      properties:
                        id:
                          type: string
                          format: uuid
                        type:
                          type: string
                          enum:
                          - payouts
                        attributes:
                          type: object
                          properties:
                            amount:
                              type: object
                              required: &id007
                              - amount
                              - currency
                              properties: &id008
                                amount:
                                  type: integer
                                  description: Amount in the lowest denomination of the currency
                                currency:
                                  type: string
                                  description: ISO 3-letter currency code
                                  example: EUR
                            status:
                              type: string
                              enum:
                              - pending
                              - paid
                              - failed
                              - canceled
                              - in_transit
                              - transfer_to_come
                            pspId:
                              type:
                              - string
                              - 'null'
                              description: Payment service provider payout identifier (e.g. Stripe payout ID)
                            createdAt:
                              type:
                              - string
                              - 'null'
                              format: date-time
                            arrivedAt:
                              type:
                              - string
                              - 'null'
                              format: date-time
                            transfers:
                              type: array
                              items:
                                type: object
                                properties:
                                  uuid:
                                    type: string
                                    format: uuid
                                  amount:
                                    type: object
                                    required: *id007
                                    properties: *id008
                                  pspId:
                                    type:
                                    - string
                                    - 'null'
                                    description: Payment service provider transfer identifier
                                  type:
                                    type: string
                                    enum:
                                    - order_payment
                                    - refund
                                  source:
                                    type: object
                                    required:
                                    - uuid
                                    properties:
                                      uuid:
                                        type: string
                                        format: uuid
                                      reference:
                                        type: string
                                        description: Order reference (only present for order_payment transfers)
                                      masterOrderUuid:
                                        type: string
                                        format: uuid
                                        description: Master order UUID (only present for order_payment transfers)
                                      customerStoreName:
                                        type: string
                                        description: Retailer store name (only present for order_payment transfers)
                                      type:
                                        type: string
                                        enum:
                                        - internal
                                        - external
                                        description: Order type (only present for order_payment transfers)
                                      invoices:
                                        type: array
                                        description: Related invoices (only present for order_payment transfers)
                                        items:
                                          type: object
                                          properties:
                                            title:
                                              type: string
                                            number:
                                              type:
                                              - string
                                              - 'null'
                                            path:
                                              type:
                                              - string
                                              - 'null'
                                            isGenerated:
                                              type: boolean
                  meta:
                    type: object
                    additionalProperties: true
                    required:
                    - page
                    properties:
                      page:
                        type: object
                        additionalProperties: true
                        properties:
                          currentPage:
                            type: integer
                          from:
                            type: integer
                          lastPage:
                            type: integer
                          perPage:
                            type: integer
                          to:
                            type: integer
                          total:
                            type: integer
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                type: object
                additionalProperties: false
                properties: &id010
                  errors:
                    type: array
                    uniqueItems: true
                    items:
                      type: object
                      properties:
                        code:
                          description: An application-specific error code, expressed as a string value.
                          type: string
                        detail:
                          description: A human-readable explanation specific to this occurrence of the problem.
                          type: string
                        status:
                          description: The HTTP status code applicable to this problem, expressed as a string value.
                          type: string
                        title:
                          description: The HTTP status code description applicable to this problem
                          type: string
                        source:
                          type: object
                          description: Optional object pointing towards the problematic field
                          properties:
                            pointer:
                              type: string
                              description: The field key
                        meta:
                          description: Non-standard meta-information that can not be represented as an attribute or relationship.
                          type: object
                          additionalProperties: true
                      additionalProperties: false
                  jsonapi:
                    description: An object describing the server's implementation
                    type: object
                    properties: *id009
                    additionalProperties: false
                required: &id011
                - errors
              example:
                jsonapi:
                  version: '1.0'
                errors:
                - detail: Unauthorized
                  status: '401'
        '403':
          description: '[Forbidden](https://jsonapi.org/format/#crud-creating-responses-403)'
          content:
            application/vnd.api+json:
              schema:
                type: object
                additionalProperties: false
                properties: *id010
                required: *id011
              example:
                jsonapi:
                  version: '1.0'
                errors:
                - detail: Forbidden
                  status: '403'
        '406':
          description: Not Acceptable
          content:
            application/vnd.api+json:
              schema:
                type: object
                additionalProperties: false
                properties: *id010
                required: *id011
              example:
                jsonapi:
                  version: '1.0'
                errors:
                - detail: Not Acceptable
                  status: '406'
        '415':
          description: Unsupported Media Type
          content:
            application/vnd.api+json:
              schema:
                type: object
                additionalProperties: false
                properties: *id010
                required: *id011
              example:
                jsonapi:
                  version: '1.0'
                errors:
                - detail: Unsupported Media Type
                  status: '415'
        '429':
          description: '[Too Many Requests](https://jsonapi.org/format/#errors)'
          content:
            application/vnd.api+json:
              schema:
                type: object
                additionalProperties: false
