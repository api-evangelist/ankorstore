                        id:
                          type: string
                          format: uuid
                        type:
                          type: string
                          default: brands
                        attributes:
                          type: object
                          required:
                          - name
                          - automationMode
                          - marketplaceStockLocation
                          - images
                          - link
                          properties:
                            name:
                              description: Brand name
                              type: string
                            automationMode:
                              type: string
                              enum:
                              - automatic-brand_control
                              - automatic-confirm-and-request-fulfillment
                            marketplaceStockLocation:
