    post:
      summary: Add products to an operation
      description: Add products data to an existing Operation resource
      operationId: post-catalog-integration-operation-products
      tags:
      - Catalog Integrations
      parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
