                    properties:
                      id:
                        type: string
                        description: User-defined unique identifier of the product
                      type:
                        type: string
                        description: Type of resource
                        default: catalog-integration-product
                      attributes:
                        type: object
                        description: "The product attributes. In case of a deletion operation, no attribute is expected. The only required information is the unique product identifier to delete (see following example).\n```json\n {\n    \"id\": \"<User-defined Identifier>\",\n    \"type\": \"catalog-integration-product\"\n }\n```\n"
                        properties:
                          external_id:
                            type: string
                            description: ID from external source
                          name:
                            type: string
                            description: Product name
                          tags:
                            type: array
                            description: List of product tags
                            items:
                              tag:
                                type: string
                                description: Tag name
                                enum:
                                - tags_fresh_product
                                - tags_frozen_product
                                - tags_organic
                                - tags_handmade
                                - tags_eco_friendly
                                - tags_zero_waste
                                - tags_cruelty_free
                                - tags_bestseller
                                - tags_vegan
                                - tags_contains_alcohol
                          main_image:
                            type: string
                            description: 'URL of the image that will be used as main one for the product

                              > It will have the number 1 order

                              '
                          images:
                            type: array
                            description: List of additional images for the product (Variants will inherit them)
                            items:
                              type: object
                              description: Image
                              properties:
                                order:
                                  type: integer
