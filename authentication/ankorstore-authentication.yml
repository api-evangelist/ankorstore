notes: >-
  The Ankorstore Public API uses OAuth2 Client Credentials. Exchange client_id/client_secret at
  POST https://www.ankorstore.com/oauth/token (sandbox: https://www.public.ankorstore-sandbox.com/oauth/token)
  with scope=* to receive a Bearer token valid for 3600s. The /oauth/token endpoint is rate-limited to
  60 requests/hour. Applications and their client credentials are created in the Integrations area of the
  Ankorstore account (https://ankorstore.com/account/integrations). The ASTRAL spec additionally declares a
  session-cookie apiKey scheme (ankorstore_session) for browser-context calls.
