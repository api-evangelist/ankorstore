aid: ankorstore
name: Ankorstore
description: >-
  Ankorstore is a European B2B wholesale marketplace that connects independent brands with independent
  retailers across Europe. Its public developer platform lets brands and their technical partners
  programmatically manage their presence on the marketplace: sync product catalogs and stock, update
  prices, process and transition orders, request shipping quotes and schedule pickups, manage Ankorstore
  Fulfillment Center replenishments, run OrderPay flows for a brand's own customers, and subscribe to
  real-time webhook notifications. The API is built on the JSON:API specification, secured with OAuth2
  client credentials, and ships alongside the ASTRAL stock-tracking/logistics API and a fulfillment
  media service, with a public sandbox environment and a downloadable mock server for testing.
