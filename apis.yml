- aid: ankorstore:ankorstore-deprecated-api
  name: Ankorstore Deprecated API
  description: >-
    ℹ️ Here you can find the endpoints which are currently deprecated and will be removed in the future
    versions of the API.

    We strongly encourage you to migrate away from these endpoints in order to prevent any future problems
    with API.


    ## ❄️ Shipping an Order


    | ⚡ This documentation is deprecated |

    |------------------------------------|

    ### Schedule a Pickup


    If the brand is not taking the parcels to the local drop-off point for the carrier the brand can schedule
    a pickup for this order. A pickup can only be scheduled on a working day (monday to friday). For full
    information please refer to the API documentation.


    <div class="info">


    #### Pickup is not accepted


    For now, Ankorstore does not know in advance which date/time configuration is available, if the requested
    pickup is denied please try a different date or time frame.


    </div>
